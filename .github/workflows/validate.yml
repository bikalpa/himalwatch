name: validate-detection

# Manual check of water-detection rules against well-known lakes.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years to test (space separated)"
        default: "2022 2024 2026"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/gee/validate_known_lakes.py --years ${{ github.event.inputs.years }}
        env:
          GEE_PROJECT:             ${{ secrets.GEE_PROJECT }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
