name: pipeline

on:
  schedule:
    - cron: "0 2 * * 0"       # Every Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      years:
        description: "Season year(s) to process, space separated (default: latest complete Sep–Oct season). Use several for a backfill, e.g. 2019 2020 2021"
        required: false
        default: ""
      tiles:
        description: "Region(s) to re-detect, space separated (default: all). Other regions keep their existing data."
        required: false
        default: ""
      notify:
        description: "Send alerts (untick for a dry run that only prints them)"
        type: boolean
        default: true

# One run at a time — runs share the R2 bucket.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read
  issues: write      # alert fan-out opens GitHub Issues for HIGH alerts
  actions: write     # keepalive re-enables this workflow (see last job)

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Detect lakes — parallel matrix over all 6 AOI tiles
  # -----------------------------------------------------------------------
  detect:
    name: detect / ${{ matrix.tile }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix:
        tile: [far_west, karnali, annapurna, langtang, khumbu, kangchenjunga]
      fail-fast: false       # continue other tiles if one fails
      max-parallel: 2        # Earth Engine noncommercial projects have a low concurrency limit

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Detect lakes
        run: |
          # No input -> the script picks the latest complete Sep–Oct season.
          YEARS="${{ github.event.inputs.years }}"
          TILES="${{ github.event.inputs.tiles }}"
          if [ -n "$TILES" ] && ! echo " $TILES " | grep -q " ${{ matrix.tile }} "; then
            echo "Skipping ${{ matrix.tile }} (not in: $TILES)"
            exit 0
          fi
          if [ -z "$YEARS" ]; then
            python pipeline/gee/lake_detection.py --tile ${{ matrix.tile }} --output-dir ./outputs --export-r2
          else
            for YEAR in $YEARS; do
              echo "::group::tile=${{ matrix.tile }} year=$YEAR"
              python pipeline/gee/lake_detection.py --tile ${{ matrix.tile }} --year "$YEAR" --output-dir ./outputs --export-r2
              echo "::endgroup::"
            done
          fi
        env:
          GEE_PROJECT:              ${{ secrets.GEE_PROJECT }}
          GEE_SERVICE_ACCOUNT_KEY:  ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          R2_ENDPOINT_URL:          ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:         ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:     ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:           ${{ secrets.R2_BUCKET_NAME }}

      - name: Upload run log artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log-${{ matrix.tile }}
          path: outputs/${{ matrix.tile }}/run_log.json
          if-no-files-found: ignore

  # -----------------------------------------------------------------------
  # Job 2: dbt + export marts — runs after all detect jobs complete
  # -----------------------------------------------------------------------
  transform:
    name: dbt + export marts
    needs: detect
    runs-on: ubuntu-latest
    if: always()             # run even if some tiles failed (uses what is in R2)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt + export deps
        run: pip install dbt-duckdb boto3 python-dotenv pandas pyarrow shapely

      # Give every lake one stable id across years (raw files have random ids)
      - name: Link detections across years
        run: python pipeline/link_lakes.py
        env:
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}

      - name: Write dbt profiles.yml
        run: |
          ACCOUNT_ID=$(echo "$R2_ENDPOINT_URL" | sed 's|https://||' | cut -d. -f1)
          cat > dbt/profiles.yml <<EOF
          himalwatch:
            target: prod
            outputs:
              prod:
                type: duckdb
                path: /tmp/himalwatch.duckdb
                extensions: [httpfs]
                settings:
                  s3_endpoint: "${ACCOUNT_ID}.r2.cloudflarestorage.com"
                  s3_access_key_id: "${R2_ACCESS_KEY_ID}"
                  s3_secret_access_key: "${R2_SECRET_ACCESS_KEY}"
                  s3_use_ssl: true
                  s3_url_style: path
          EOF
        env:
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Run dbt models
        working-directory: dbt
        run: dbt run --profiles-dir .
        env:
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}

      - name: Run dbt tests
        working-directory: dbt
        run: dbt test --profiles-dir .
        env:
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}

      - name: Export marts to R2
        run: python dbt/export_marts.py
        env:
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}

  # -----------------------------------------------------------------------
  # Job 3: Satellite snapshots + growth GIFs for growing / large lakes
  # -----------------------------------------------------------------------
  media:
    name: snapshots + GIFs
    needs: transform
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: always() && needs.transform.result == 'success'
    continue-on-error: true      # alerts still go out if imagery fails

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt pillow
      - name: Build snapshots and GIFs
        run: python pipeline/media/lake_gifs.py --max-lakes 80
        env:
          GEE_PROJECT:              ${{ secrets.GEE_PROJECT }}
          GEE_SERVICE_ACCOUNT_KEY:  ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          R2_ENDPOINT_URL:          ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:         ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:     ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:           ${{ secrets.R2_BUCKET_NAME }}

  # -----------------------------------------------------------------------
  # Job 4: Publish — refresh the dashboard cache, then send growth alerts
  # -----------------------------------------------------------------------
  publish:
    name: dashboard cache + alerts
    needs: [transform, media]
    runs-on: ubuntu-latest
    if: always() && needs.transform.result == 'success'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install boto3 python-dotenv requests pandas pyarrow anthropic
      - name: Collect news and coverage for named lakes
        # Best effort: a blocked or slow news search must never stop the alerts.
        continue-on-error: true
        timeout-minutes: 20
        run: python pipeline/news/lake_news.py
        env:
          # Optional: lets Claude judge relevance and duplicates. Without it,
          # keyword rules alone decide.
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_MODEL:           ${{ vars.NEWS_MODEL }}
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
      - name: Refresh dashboard cache
        run: python dbt/export_worker_json.py
        env:
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
      - name: Send growth alerts
        run: python pipeline/alerts/fanout.py
        env:
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO:       ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM:     ${{ vars.ALERT_EMAIL_FROM }}
          DASHBOARD_URL:        ${{ vars.DASHBOARD_URL }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:          ${{ github.repository }}
          DRY_RUN:              ${{ github.event.inputs.notify == 'false' && '1' || '' }}

  # -----------------------------------------------------------------------
  # Job 5: Keepalive — GitHub disables scheduled workflows after 60 days
  # without repo activity (this happened in July 2026). Re-enabling via the
  # API resets that timer, so the weekly cron keeps firing.
  # -----------------------------------------------------------------------
  keepalive:
    name: keepalive
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
